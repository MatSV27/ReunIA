<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Architecture diagram: a Telegram message flows through an Extraction Agent Cloud Function into Firestore and back as a confirmation; separately, Cloud Scheduler triggers a Follow-up Agent Cloud Function daily, which reads Firestore, optionally calls a tool to check a task's reminder history, and sends a digest back to Telegram; a browser dashboard reads and writes Firestore directly, bypassing the Cloud Functions.">
  <style>
    text { font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; }
    .bg { fill: #EFF2F6; }
    .struct-line { stroke: #D6DCE4; fill: none; }
    .cloud-boundary { stroke: #B7C0CC; stroke-dasharray: 5 5; fill: none; }
    .node-box { fill: #FFFFFF; stroke: #D6DCE4; }
    .node-box-alt { fill: #F7F9FC; stroke: #D6DCE4; }
    .hub-box { fill: #DEF3EE; stroke: #157A63; }
    .scheduler-pill { fill: #FBEADB; stroke: #B9631A; }
    .txt-strong { font-family: "Lexend", "Segoe UI", Arial, sans-serif; font-weight: 600; fill: #161A22; }
    .txt-dim { fill: #5C6577; }
    .txt-mono { font-family: "IBM Plex Mono", "Consolas", monospace; fill: #5C6577; }
    .txt-eyebrow { font-family: "IBM Plex Mono", "Consolas", monospace; font-weight: 500; fill: #5C6577; letter-spacing: 0.08em; }
    .txt-badge { font-weight: 600; fill: #ffffff; }
    .flow-human-stroke { stroke: #3D4FC0; fill: none; }
    .flow-human-fill { fill: #3D4FC0; }
    .flow-human-text { fill: #3D4FC0; font-weight: 500; }
    .flow-auto-stroke { stroke: #B9631A; fill: none; }
    .flow-auto-fill { fill: #B9631A; }
    .flow-auto-text { fill: #B9631A; font-weight: 500; }
    .flow-state-stroke { stroke: #157A63; fill: none; }
    .flow-state-fill { fill: #157A63; }
    .flow-state-text { fill: #157A63; font-weight: 500; }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="620"></rect>

  <defs>
    <marker id="arrow-human" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon class="flow-human-fill" points="0,0 10,5 0,10"></polygon>
    </marker>
    <marker id="arrow-auto" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon class="flow-auto-fill" points="0,0 10,5 0,10"></polygon>
    </marker>
    <marker id="arrow-state" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon class="flow-state-fill" points="0,0 10,5 0,10"></polygon>
    </marker>
  </defs>

  <rect class="cloud-boundary" x="300" y="40" width="620" height="470" rx="14"></rect>
  <text class="txt-eyebrow" x="322" y="66" font-size="11">GOOGLE CLOUD &#8212; RUNS BY ITSELF, NOTHING BELOW NEEDS A HUMAN TO OPERATE IT</text>

  <rect class="node-box" x="40" y="210" width="200" height="130" rx="12"></rect>
  <circle cx="66" cy="238" r="10" class="node-box-alt"></circle>
  <path d="M60,234 q6,-8 12,0 q6,8 12,0" class="struct-line" stroke-width="1.4"></path>
  <text class="txt-strong" x="86" y="243" font-size="16">You</text>
  <text class="txt-dim" x="60" y="268" font-size="12.5">Telegram chat with the bot</text>
  <text class="txt-mono" x="60" y="322" font-size="11">voice note or plain text</text>

  <rect class="node-box" x="350" y="90" width="250" height="112" rx="12"></rect>
  <text class="txt-strong" x="374" y="122" font-size="15.5">Extraction Agent</text>
  <text class="txt-dim" x="374" y="144" font-size="12.5">turns a note into tracked tasks</text>
  <line x1="374" y1="158" x2="576" y2="158" class="struct-line" stroke-width="1"></line>
  <text class="txt-mono" x="374" y="176" font-size="11">Cloud Function (Gen2)</text>
  <text class="txt-mono" x="374" y="191" font-size="11">Google ADK &#183; Gemini 3.5</text>

  <rect class="scheduler-pill" x="392" y="278" width="216" height="46" rx="23"></rect>
  <circle cx="416" cy="301" r="9" fill="none" class="flow-auto-stroke" stroke-width="1.6"></circle>
  <line x1="416" y1="301" x2="416" y2="295" class="flow-auto-stroke" stroke-width="1.6"></line>
  <line x1="416" y1="301" x2="420" y2="304" class="flow-auto-stroke" stroke-width="1.6"></line>
  <text class="txt-strong" x="434" y="298" font-size="12.5">Cloud Scheduler</text>
  <text class="flow-auto-text" x="434" y="313" font-size="11">daily, 9am &#8212; nobody clicks anything</text>
  <line x1="500" y1="324" x2="500" y2="350" class="flow-auto-stroke" stroke-width="1.6" marker-end="url(#arrow-auto)"></line>

  <rect class="node-box" x="350" y="350" width="250" height="112" rx="12"></rect>
  <text class="txt-strong" x="374" y="382" font-size="15.5">Follow-up Agent</text>
  <text class="txt-dim" x="374" y="404" font-size="12.5">decides who to nudge, how hard</text>
  <line x1="374" y1="418" x2="576" y2="418" class="struct-line" stroke-width="1"></line>
  <text class="txt-mono" x="374" y="436" font-size="11">Cloud Function (Gen2)</text>
  <text class="txt-mono" x="374" y="451" font-size="11">Google ADK &#183; Gemini 3.5</text>

  <rect class="hub-box" x="680" y="140" width="210" height="280" rx="16"></rect>
  <ellipse cx="785" cy="172" rx="86" ry="12" class="hub-box"></ellipse>
  <text class="txt-strong" x="705" y="212" font-size="16" fill="#157A63">Firestore</text>
  <text class="txt-dim" x="705" y="233" font-size="12">the shared memory</text>
  <line x1="705" y1="252" x2="865" y2="252" class="flow-state-stroke" stroke-width="1" stroke-dasharray="2 3"></line>
  <text class="txt-mono" x="705" y="276" font-size="11.5">tasks</text>
  <text class="txt-dim" x="705" y="292" font-size="11">status, owner, due date, reminders</text>
  <line x1="705" y1="312" x2="865" y2="312" class="flow-state-stroke" stroke-width="1" stroke-dasharray="2 3"></line>
  <text class="txt-mono" x="705" y="336" font-size="11.5">tasks / events</text>
  <text class="txt-dim" x="705" y="352" font-size="11">timestamped history, per task</text>
  <text class="txt-dim" x="705" y="398" font-size="11">read and written by both agents &#8212;</text>
  <text class="txt-dim" x="705" y="412" font-size="11">the one thing they share.</text>

  <rect class="node-box" x="960" y="210" width="200" height="130" rx="12"></rect>
  <rect x="984" y="234" width="46" height="30" rx="3" class="node-box-alt" stroke-width="1.2"></rect>
  <line x1="984" y1="242" x2="1030" y2="242" class="struct-line" stroke-width="1"></line>
  <text class="txt-strong" x="984" y="288" font-size="16">Dashboard</text>
  <text class="txt-dim" x="984" y="309" font-size="12.5">see everything, mark done</text>
  <text class="txt-mono" x="984" y="330" font-size="11">React &#183; browser only, no backend</text>

  <path d="M240,248 C 290,248 300,140 350,138" class="flow-human-stroke" stroke-width="1.8" marker-end="url(#arrow-human)"></path>
  <circle cx="262" cy="240" r="10" class="flow-human-fill"></circle>
  <text class="txt-badge" x="262" y="244" font-size="10.5" text-anchor="middle">1</text>
  <text class="flow-human-text" x="278" y="222" font-size="12">sends a voice note or text</text>

  <path d="M600,150 C 640,150 650,190 680,192" class="flow-human-stroke" stroke-width="1.8" marker-end="url(#arrow-human)"></path>
  <circle cx="622" cy="150" r="10" class="flow-human-fill"></circle>
  <text class="txt-badge" x="622" y="154" font-size="10.5" text-anchor="middle">2</text>
  <text class="flow-human-text" x="608" y="132" font-size="12">extracts &amp; saves tasks</text>

  <path d="M350,178 C 300,210 280,300 240,304" class="flow-human-stroke" stroke-width="1.8" marker-end="url(#arrow-human)"></path>
  <circle cx="304" cy="272" r="10" class="flow-human-fill"></circle>
  <text class="txt-badge" x="304" y="276" font-size="10.5" text-anchor="middle">3</text>
  <text class="flow-human-text" x="270" y="345" font-size="12">confirms what got saved</text>

  <path d="M600,392 C 640,392 650,340 680,336" class="flow-auto-stroke" stroke-width="1.8" marker-end="url(#arrow-auto)"></path>
  <circle cx="622" cy="392" r="10" class="flow-auto-fill"></circle>
  <text class="txt-badge" x="622" y="396" font-size="10.5" text-anchor="middle">4</text>
  <text class="flow-auto-text" x="605" y="412" font-size="12">reviews every pending task</text>

  <path d="M600,438 C 660,460 700,440 700,412" class="flow-auto-stroke" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-auto)"></path>
  <circle cx="644" cy="456" r="10" class="flow-auto-fill"></circle>
  <text class="txt-badge" x="644" y="460" font-size="10.5" text-anchor="middle">5</text>
  <text class="flow-auto-text" x="590" y="480" font-size="12">tool call: checks a task's history</text>
  <text class="txt-dim" x="590" y="495" font-size="11">only when the reminder count alone is ambiguous</text>

  <path d="M350,430 C 260,460 180,400 160,342" class="flow-auto-stroke" stroke-width="1.8" marker-end="url(#arrow-auto)"></path>
  <circle cx="216" cy="452" r="10" class="flow-auto-fill"></circle>
  <text class="txt-badge" x="216" y="456" font-size="10.5" text-anchor="middle">6</text>
  <text class="flow-auto-text" x="70" y="472" font-size="12">sends one digest, only if</text>
  <text class="flow-auto-text" x="70" y="488" font-size="12">something needs attention</text>

  <path d="M890,255 C 920,255 930,255 960,262" class="flow-state-stroke" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-state)"></path>
  <path d="M960,296 C 930,296 920,296 890,290" class="flow-state-stroke" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-state)"></path>
  <text class="flow-state-text" x="895" y="245" font-size="11.5">reads live</text>
  <text class="flow-state-text" x="895" y="313" font-size="11.5">marks done</text>
  <text class="txt-dim" x="895" y="330" font-size="10.5">no Cloud Function in between</text>
</svg>
